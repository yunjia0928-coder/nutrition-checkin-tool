<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jiababa營養師 - 江江專屬每日Check List</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #111827;
      --ok: #065f46;
      --ok-bg: #d1fae5;
      --warn: #92400e;
      --warn-bg: #fef3c7;
      --bad: #991b1b;
      --bad-bg: #fee2e2;
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 16px 56px;
    }

    .hero, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.2;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.25fr 0.9fr;
      gap: 18px;
    }

    .card {
      padding: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 14px;
    }

    .row {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    label.title {
      font-weight: 700;
      font-size: 15px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: -4px;
    }

    input[type="date"], input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 88px;
    }

    .option-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 14px;
      background: #fff;
      cursor: pointer;
      transition: 0.18s ease;
      user-select: none;
      font-size: 14px;
    }

    .chip:hover {
      transform: translateY(-1px);
      border-color: #cbd5e1;
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .checkbox-list {
      display: grid;
      gap: 10px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #fff;
    }

    .checkbox-item input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      cursor: pointer;
    }

    .primary {
      background: var(--primary);
      color: #fff;
    }

    .secondary {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--text);
    }

    .danger {
      background: #fff;
      border: 1px solid #fecaca;
      color: var(--bad);
    }

    .summary-box {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: #fff;
      margin-bottom: 12px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 24px;
      font-weight: 800;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .tag {
      font-size: 12px;
      border-radius: 999px;
      padding: 6px 10px;
      border: 1px solid transparent;
    }

    .tag.ok { color: var(--ok); background: var(--ok-bg); }
    .tag.warn { color: var(--warn); background: var(--warn-bg); }
    .tag.bad { color: var(--bad); background: var(--bad-bg); }

    .history-list {
      display: grid;
      gap: 10px;
      max-height: 420px;
      overflow: auto;
      padding-right: 4px;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .history-date {
      font-weight: 800;
    }

    .history-score {
      color: var(--muted);
      font-size: 14px;
    }

    .history-meta {
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      border: 1px dashed var(--line);
      border-radius: 14px;
      padding: 16px;
      background: #fff;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .wrap { padding: 16px 12px 36px; }
      .hero, .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1 id="appTitle">Jiababa營養師 - 江江專屬每日Check List</h1>
      <p class="subtitle" id="appSubtitle">每天花 30 秒回顧，照著自己的步調前進 ˗ˏˋ ❤ˎˊ˗</p>
    </section>

    <div class="grid">
      <section class="card">
        <h2 class="section-title">今日填寫</h2>
        <div id="formArea"></div>
        <div class="actions">
          <button class="primary" id="saveBtn">儲存今天紀錄</button>
          <button class="secondary" id="exportBtn">匯出 JSON</button>
          <button class="danger" id="clearBtn">清空所有紀錄</button>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">本週摘要</h2>
        <div id="weeklySummary"></div>
      </section>
    </div>

    <section class="card" style="margin-top:18px;">
      <h2 class="section-title">最近紀錄</h2>
      <div id="historyArea"></div>
    </section>
  </div>

  <script>
    const CONFIG = {
      appTitle: "Jiababa營養師 - 江江專屬每日Check List",
      appSubtitle: "每天花 30 秒回顧，照著自己的步調前進 ˗ˏˋ ❤ˎˊ˗",
      storageKey: "jiababa_checkin_v1",
      questions: [
        {
          id: "date",
          type: "date",
          label: "日期",
          required: true,
          defaultToday: true,
        },
        {
          id: "carb",
          type: "singleChoice",
          label: "今天總澱粉量？",
          required: true,
          options: ["不足2份", "2-4份", "4-6份", "6-8份", "8份以上"],
          scoreMap: { "不足2份": 0, "2-4份": 1, "4-6份": 2, "6-8份": 1, "8份以上": 0 },
        },
        {
          id: "protein",
          type: "singleChoice",
          label: "今天總蛋白質量？",
          required: true,
          options: ["不足8份", "滿8-10份", "滿10-12份", "滿12-14份", "14份以上"],
          scoreMap: { "不足8份": 0, "滿8-10份": 1, "滿10-12份": 2, "滿12-14份": 1, "14份以上": 0 },
        },
        {
          id: "oil",
          type: "multiChoice",
          label: "今天總油量？",
          required: true,
          hint: "請勾 1 個油量區間，再依情況勾炸物或好油份數。",
          options: [
            "不足3份",
            "3–4份",
            "4–6份",
            "超過6份",
            "炸物",
            "好油佔2份",
            "好油佔3份"
          ],
          multiScoreMap: {
            "不足3份": 0,
            "3–4份": 2,
            "4–6份": 1,
            "超過6份": 0,
            "炸物": -1,
            "好油佔2份": 1,
            "好油佔3份": 2
          },
          conditionalRules: [
            { ifAllSelected: ["不足3份", "炸物"], scoreDelta: -1 },
            { ifAllSelected: ["超過6份", "炸物"], scoreDelta: -1 }
          ]
        },
        {
          id: "vegetable",
          type: "singleChoice",
          label: "今日攝取蔬菜量？",
          required: true,
          options: ["不足3份", "滿3-6份", "6份以上"],
          scoreMap: { "不足3份": 0, "滿3-6份": 2, "6份以上": 1 },
        },
        {
          id: "plantBased",
          type: "singleChoice",
          label: "植物性蛋白質攝取量？",
          required: true,
          options: ["未達標", "佔今日蛋白質1/3", "佔今日蛋白質1/2以上"],
          scoreMap: { "未達標": 0, "佔今日蛋白質1/3": 1, "佔今日蛋白質1/2以上": 2 },
        },
        {
          id: "wholeGrains",
          type: "multiChoice",
          label: "澱粉選擇？",
          required: true,
          hint: "可同時勾選多個選項。",
          options: [
            "非精緻澱粉佔50%以上",
            "有非精緻澱粉但<50%",
            "有喝含糖飲料(包括加料無糖茶)",
            "有吃甜點(>1拳頭)",
            "一整天都沒有非精緻全穀雜糧"
          ],
          multiScoreMap: {
            "非精緻澱粉佔50%以上": 2,
            "有非精緻澱粉但<50%": 0,
            "有喝含糖飲料(包括加料無糖茶)": -1,
            "有吃甜點(>1拳頭)": -1,
            "一整天都沒有非精緻全穀雜糧": -1
          }
        },
        {
          id: "water",
          type: "singleChoice",
          label: "今日攝取水量？",
          required: true,
          options: ["<1500", "1500-2000", "2000-2500", ">2500"],
          scoreMap: { "<1500": -1, "1500-2000": 0, "2000-2500": 1, ">2500": 2 },
        },
        {
          id: "context",
          type: "multiChoice",
          label: "今天有沒有以下情況？",
          options: ["下午茶", "月經", "聚餐", "壓力大", "睡不好", "外食>2餐", "胃不舒服", "感冒/頭痛", "以上皆無"],
        },
        {
          id: "note",
          type: "textarea",
          label: "備註",
          placeholder: "例如：下午很忙，晚餐比較晚吃；今天有聚餐但沒有補償。",
        }
      ]
    };

    const state = {
      records: loadRecords(),
      values: {}
    };

    const formArea = document.getElementById("formArea");
    const weeklySummary = document.getElementById("weeklySummary");
    const historyArea = document.getElementById("historyArea");

    document.getElementById("appTitle").textContent = CONFIG.appTitle;
    document.getElementById("appSubtitle").textContent = CONFIG.appSubtitle;

    renderForm();
    renderWeeklySummary();
    renderHistory();

    document.getElementById("saveBtn").addEventListener("click", saveRecord);
    document.getElementById("exportBtn").addEventListener("click", exportJSON);
    document.getElementById("clearBtn").addEventListener("click", clearRecords);

    function renderForm() {
      formArea.innerHTML = "";
      state.values = {};

      CONFIG.questions.forEach((q) => {
        const row = document.createElement("div");
        row.className = "row";

        const label = document.createElement("label");
        label.className = "title";
        label.textContent = q.label + (q.required ? " *" : "");
        row.appendChild(label);

        if (q.hint) {
          const hint = document.createElement("div");
          hint.className = "hint";
          hint.textContent = q.hint;
          row.appendChild(hint);
        }

        if (q.type === "date") {
          const input = document.createElement("input");
          input.type = "date";
          input.value = q.defaultToday ? getTodayString() : "";
          state.values[q.id] = input.value;
          input.addEventListener("input", (e) => state.values[q.id] = e.target.value);
          row.appendChild(input);
        }

        if (q.type === "textarea") {
          const input = document.createElement("textarea");
          input.placeholder = q.placeholder || "";
          state.values[q.id] = "";
          input.addEventListener("input", (e) => state.values[q.id] = e.target.value.trim());
          row.appendChild(input);
        }

        if (q.type === "singleChoice") {
          const wrap = document.createElement("div");
          wrap.className = "option-btns";
          state.values[q.id] = "";

          q.options.forEach((option) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "chip";
            btn.textContent = option;
            btn.addEventListener("click", () => {
              state.values[q.id] = option;
              [...wrap.children].forEach((el) => el.classList.remove("active"));
              btn.classList.add("active");
            });
            wrap.appendChild(btn);
          });
          row.appendChild(wrap);
        }

        if (q.type === "multiChoice") {
          const wrap = document.createElement("div");
          wrap.className = "checkbox-list";
          state.values[q.id] = [];

          q.options.forEach((option) => {
            const item = document.createElement("label");
            item.className = "checkbox-item";
            const input = document.createElement("input");
            input.type = "checkbox";
            input.addEventListener("change", (e) => {
              if (e.target.checked) {
                if (!state.values[q.id].includes(option)) {
                  state.values[q.id].push(option);
                }
              } else {
                state.values[q.id] = state.values[q.id].filter((x) => x !== option);
              }
            });
            const span = document.createElement("span");
            span.textContent = option;
            item.appendChild(input);
            item.appendChild(span);
            wrap.appendChild(item);
          });
          row.appendChild(wrap);
        }

        formArea.appendChild(row);
      });
    }

    function validateForm() {
      for (const q of CONFIG.questions) {
        if (!q.required) continue;
        const value = state.values[q.id];

        if (q.type === "multiChoice") {
          if (!Array.isArray(value) || value.length === 0) {
            alert(`請先填寫：${q.label}`);
            return false;
          }
          continue;
        }

        if (value === undefined || value === null || value === "") {
          alert(`請先填寫：${q.label}`);
          return false;
        }
      }
      return true;
    }

    function saveRecord() {
      if (!validateForm()) return;

      const record = {
        savedAt: new Date().toISOString(),
        answers: structuredClone(state.values),
        totalScore: calculateScore(state.values)
      };

      const dateId = record.answers.date || record.savedAt.slice(0, 10);
      const existingIndex = state.records.findIndex((r) => (r.answers.date || "") === dateId);
      if (existingIndex >= 0) {
        state.records[existingIndex] = record;
      } else {
        state.records.push(record);
      }

      state.records.sort((a, b) => (b.answers.date || "").localeCompare(a.answers.date || ""));
      persistRecords();
      renderWeeklySummary();
      renderHistory();
      alert("已儲存今天紀錄");
    }

    function calculateScore(values) {
      let score = 0;

      CONFIG.questions.forEach((q) => {
        const value = values[q.id];

        if (q.scoreMap && value in q.scoreMap) {
          score += q.scoreMap[value];
        }

        if (q.type === "multiChoice" && q.multiScoreMap && Array.isArray(value)) {
          value.forEach((selected) => {
            if (selected in q.multiScoreMap) {
              score += q.multiScoreMap[selected];
            }
          });
        }

        if (q.type === "multiChoice" && q.conditionalRules && Array.isArray(value)) {
          q.conditionalRules.forEach((rule) => {
            const hitAll = (rule.ifAllSelected || []).every((item) => value.includes(item));
            if (hitAll) {
              score += rule.scoreDelta || 0;
            }
          });
        }
      });

      return score;
    }

    function renderWeeklySummary() {
      const last7 = getLast7DaysRecords(state.records);
      const days = last7.length;
      const maxPerDay = CONFIG.questions.reduce((sum, q) => {
        let maxScore = 0;
        if (q.scoreMap) {
          maxScore += Math.max(...Object.values(q.scoreMap));
        }
        if (q.multiScoreMap) {
          const positives = Object.values(q.multiScoreMap).filter((v) => v > 0);
          if (positives.length) {
            maxScore += positives.reduce((a, b) => a + b, 0);
          }
        }
        if (q.conditionalRules) {
          const positiveRules = q.conditionalRules.map((r) => r.scoreDelta || 0).filter((v) => v > 0);
          if (positiveRules.length) {
            maxScore += positiveRules.reduce((a, b) => a + b, 0);
          }
        }
        return sum + maxScore;
      }, 0);

      const total = last7.reduce((sum, r) => sum + (r.totalScore || 0), 0);
      const avg = days ? (total / days).toFixed(1) : "0.0";

      let qualityTag = { label: "本週還沒有資料", cls: "warn" };
      if (days > 0) {
        const ratio = maxPerDay > 0 ? total / (days * maxPerDay) : 0;
        if (ratio >= 0.75) qualityTag = { label: "整體穩定度不錯", cls: "ok" };
        else if (ratio >= 0.45) qualityTag = { label: "中間，有些地方可再調整", cls: "warn" };
        else qualityTag = { label: "這週比較容易亂，需要先降難度", cls: "bad" };
      }

      weeklySummary.innerHTML = `
        <div class="summary-box">
          <div class="summary-label">最近 7 天有填寫</div>
          <div class="summary-value">${days} 天</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">平均每日分數</div>
          <div class="summary-value">${avg}</div>
        </div>
        <div class="summary-box">
          <div class="summary-label">快速判讀</div>
          <div class="tag-row">
            <span class="tag ${qualityTag.cls}">${qualityTag.label}</span>
          </div>
        </div>
      `;
    }

    function renderHistory() {
      if (!state.records.length) {
        historyArea.innerHTML = `<div class="empty">目前還沒有紀錄。先填一筆今天的 check-in 試試看。</div>`;
        return;
      }

      historyArea.innerHTML = `<div class="history-list"></div>`;
      const list = historyArea.querySelector(".history-list");

      state.records.forEach((record) => {
        const note = record.answers.note || "";
        const contexts = Array.isArray(record.answers.context) ? record.answers.context : [];
        const oil = Array.isArray(record.answers.oil) ? record.answers.oil : [];
        const wholeGrains = Array.isArray(record.answers.wholeGrains) ? record.answers.wholeGrains : [];

        const item = document.createElement("div");
        item.className = "history-item";
        item.innerHTML = `
          <div class="history-top">
            <div>
              <div class="history-date">${record.answers.date || "未填日期"}</div>
              <div class="history-score">分數：${record.totalScore ?? 0}</div>
            </div>
          </div>
          <div class="history-meta">
            澱粉：${escapeHtml(record.answers.carb || "-")} ｜ 蛋白質：${escapeHtml(record.answers.protein || "-")} ｜ 蔬菜：${escapeHtml(record.answers.vegetable || "-")} ｜ 植物蛋白：${escapeHtml(record.answers.plantBased || "-")} ｜ 水量：${escapeHtml(record.answers.water || "-")}
          </div>
          ${oil.length ? `<div class="history-meta" style="margin-top:6px;">油脂：${oil.map(escapeHtml).join("、")}</div>` : ""}
          ${wholeGrains.length ? `<div class="history-meta" style="margin-top:6px;">澱粉選擇：${wholeGrains.map(escapeHtml).join("、")}</div>` : ""}
          ${contexts.length ? `<div class="tag-row" style="margin-top:10px;">${contexts.map((x) => `<span class="tag warn">${escapeHtml(x)}</span>`).join("")}</div>` : ""}
          ${note ? `<div style="margin-top:10px; font-size:14px;">${escapeHtml(note)}</div>` : ""}
        `;
        list.appendChild(item);
      });
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state.records, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "nutrition-checkin-records.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function clearRecords() {
      const ok = confirm("確定要清空所有紀錄嗎？這個動作無法復原。");
      if (!ok) return;
      state.records = [];
      persistRecords();
      renderWeeklySummary();
      renderHistory();
    }

    function loadRecords() {
      try {
        return JSON.parse(localStorage.getItem(CONFIG.storageKey) || "[]");
      } catch (e) {
        return [];
      }
    }

    function persistRecords() {
      localStorage.setItem(CONFIG.storageKey, JSON.stringify(state.records));
    }

    function getLast7DaysRecords(records) {
      const today = new Date();
      const cutoff = new Date(today);
      cutoff.setDate(today.getDate() - 6);
      const cutoffStr = toDateStringLocal(cutoff);
      return records.filter((r) => (r.answers.date || "") >= cutoffStr);
    }

    function getTodayString() {
      return toDateStringLocal(new Date());
    }

    function toDateStringLocal(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
